<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Destination Not Found | TravelMachan</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS (முழுக்க முழுக்க CSS Animations-உடன்) -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #ff5722; 
            --secondary-color: #2c3e50; 
            --bg-color: #f8fcfb;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .error-container {
            padding: 40px;
            max-width: 600px;
        }

        /* --- CSS Animations (Keyframes) --- */
        @keyframes bounceInDown {
            0% { opacity: 0; transform: translateY(-50px); }
            60% { opacity: 1; transform: translateY(15px); }
            80% { transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* --- Applying Animations to Elements --- */
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: var(--secondary-color);
            line-height: 1;
            margin-bottom: 10px;
            animation: bounceInDown 1s ease-out forwards; /* CSS Entry Animation */
        }

        .error-code span {
            color: var(--primary-color);
            display: inline-block;
            animation: float 3s ease-in-out infinite; /* Floating Effect */
        }

        .error-title {
            font-size: 2rem;
            color: var(--secondary-color);
            margin-bottom: 15px;
            font-weight: 600;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.3s forwards;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--secondary-color);
            border: 2px solid var(--secondary-color);
            animation-delay: 0.7s; /* Animates first */
        }

        .btn-outline:hover {
            background-color: var(--secondary-color);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.2);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            border: 2px solid var(--primary-color);
            animation-delay: 0.9s; /* Animates second */
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--primary-color);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.3);
        }

        /* Mobile Responsive */
        @media (max-width: 576px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 1.5rem; }
            .error-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- 404 Content -->
    <div class="error-container">
        <div class="error-code">4<span>0</span>4</div>
        <h2 class="error-title">Oops! You're off the map.</h2>
        <p class="error-desc">The destination you are looking for doesn't exist or has been moved. Let's get you back on track!</p>
        
        <div class="error-actions">
            <!-- JS Single Line logic added in onclick -->
            <button class="btn btn-outline" onclick="history.back()">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
            
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Go to Home
            </a>
        </div>
    </div>

</body>
</html>
